# Project-scoped tool versions and local native-build settings
min_version = "2025.1.0"

[tools]
# Keep this pin aligned with .tool-versions; CI tests Ruby 3.4 and 4.0.
ruby = "4.0.7"
shellcheck = "0.11.0"
shfmt = "3.14.1"
jq = "1.8.2"
shellspec = "0.28.1"

[env]
# Use Apple Clang for native extensions on this macOS host; Homebrew LLVM
# has caused MRI header incompatibilities.
CC = "/usr/bin/clang"
CXX = "/usr/bin/clang++"

# Keep RUBYOPT unset: globally freezing strings affects dependencies such as
# Rantly. Use per-file frozen_string_literal pragmas for project-owned code.

# Used only when the process loads jemalloc; the macOS Ruby build normally uses
# the system allocator. Keep aligned with the other projects' jemalloc tuning.
MALLOC_CONF = "dirty_decay_ms:1000,narenas:2"
