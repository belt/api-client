# CI — lint, test in parallel.
#
# Actions pinned to full SHA for supply-chain safety.
# Concurrency: cancel stale runs on same branch/PR.
#
# ruby/setup-ruby reads .tool-versions for ruby-version when
# not specified. We override with matrix values for multi-version
# testing. bundler-cache: true handles bundle install + caching.
# Bundler version auto-detected from BUNDLED WITH in Gemfile.lock.
---
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'spec/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'api-client.gemspec'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'spec/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'api-client.gemspec'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec standardrb --no-fix

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4', '4.0']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
